    // =========================================================================
    // HIGH-PERFORMANCE PROCEDURAL WEB AUDIO API & DUAL-TIER SPEECH ENGINE
    // =========================================================================
    class SoundFX {
      static ctx = null;
      static isUnlocked = false;
      static soundEnabled = true;

      static init() {
        if (typeof window === 'undefined') return null;
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        if (!this.isUnlocked) {
          this.isUnlocked = true;
          const unlock = () => {
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
          };
          window.addEventListener('click', unlock, { once: true, passive: true });
          window.addEventListener('touchstart', unlock, { once: true, passive: true });
        }
        return this.ctx;
      }

      static toggleSound(val) {
        this.soundEnabled = val !== undefined ? val : !this.soundEnabled;
        try { localStorage.setItem('smartkids_sound', this.soundEnabled ? 'true' : 'false'); } catch(e){}
        return this.soundEnabled;
      }

      static isEnabled() {
        try {
          const stored = localStorage.getItem('smartkids_sound');
          if (stored !== null) this.soundEnabled = stored === 'true';
        } catch(e){}
        return this.soundEnabled;
      }

      // Pentatonic Success Chord: C5, E5, G5, C6
      static playSuccess() {
        if (!this.isEnabled()) return;
        const ctx = this.init();
        if (!ctx) return;
        try {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          const now = ctx.currentTime;
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            const st = now + idx * 0.08;
            osc.frequency.setValueAtTime(freq, st);
            gain.gain.setValueAtTime(0.22, st);
            gain.gain.exponentialRampToValueAtTime(0.001, st + 0.45);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(st);
            osc.stop(st + 0.48);
            osc.onended = () => osc.disconnect();
          });
        } catch(e){}
      }

      // Gentle Non-Punitive Warm Error Thud: 180Hz -> 110Hz
      static playGentleError() {
        if (!this.isEnabled()) return;
        const ctx = this.init();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.18);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
          osc.onended = () => osc.disconnect();
        } catch(e){}
      }

        if (!this.isEnabled()) return;
        const ctx = this.init();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1760, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.38);
          osc.onended = () => osc.disconnect();
          setTimeout(() => this.playCoin(), 70);
        } catch(e){}
      }

      static playSoap() {
        if (!this.isEnabled()) return;
        const ctx = this.init();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(700 + Math.random() * 200, now);
          osc.frequency.exponentialRampToValueAtTime(1100, now + 0.05);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
          osc.onended = () => osc.disconnect();
        } catch(e){}
      }
    }

    class SpeechEngine {
      static synth = typeof window !== 'undefined' ? window.speechSynthesis : null;
      static fallbackAudio = typeof window !== 'undefined' ? new Audio() : null;
      static subtitleListeners = new Set();
      static subtitleTimeout = null;

      static addSubtitleListener(fn) {
        this.subtitleListeners.add(fn);
        return () => this.subtitleListeners.delete(fn);
      }

      static notifySubtitles(text, isSpeaking, durationMs = 3000) {
        if (this.subtitleTimeout) {
          clearTimeout(this.subtitleTimeout);
          this.subtitleTimeout = null;
        }
        this.subtitleListeners.forEach(fn => fn(text, isSpeaking));
        if (isSpeaking && text) {
          this.subtitleTimeout = setTimeout(() => {
            this.subtitleListeners.forEach(fn => fn(null, false));
          }, durationMs);
        }
      }

      static speak(text, lang = 'km-KH') {
        if (!text || typeof window === 'undefined') return;
        SoundFX.init();

        const containsKhmer = /[ក-៿]/.test(text);
        const targetLang = lang || (containsKhmer ? 'km-KH' : 'en-US');

        this.notifySubtitles(text, true, Math.max(2500, text.length * 85));

        if (this.synth) {
          try { this.synth.cancel(); } catch(e){}
        }

        const voices = this.synth ? this.synth.getVoices() : [];
        const hasNativeKhmer = voices.some(v =>
          v.lang.toLowerCase().includes('km') || v.lang.toLowerCase().includes('kh') || v.name.toLowerCase().includes('khmer')
        );

        if (targetLang === 'km-KH' && !hasNativeKhmer) {
          this.speakFallbackURL(text, 'km-KH');
          return;
        }

        if (this.synth) {
          try {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = targetLang;
            u.rate = targetLang === 'km-KH' ? 0.85 : 0.9;
            u.pitch = 1.05;
            const matched = voices.find(v =>
              targetLang === 'km-KH'
                ? v.lang.toLowerCase().includes('km') || v.name.toLowerCase().includes('khmer')
                : v.lang.toLowerCase().includes('en')
            );
            if (matched) u.voice = matched;
            u.onend = () => this.notifySubtitles(null, false);
            u.onerror = () => this.speakFallbackURL(text, targetLang);
            this.synth.speak(u);
          } catch(e) {
            this.speakFallbackURL(text, targetLang);
          }
        } else {
          this.speakFallbackURL(text, targetLang);
        }
      }

      static speakFallbackURL(text, lang = 'km-KH') {
        try {
          if (!this.fallbackAudio) this.fallbackAudio = new Audio();
          this.fallbackAudio.pause();
          const encoded = encodeURIComponent(text.slice(0, 180));
          const tl = lang === 'km-KH' ? 'km' : 'en';
          this.fallbackAudio.src = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encoded}&tl=${tl}&client=tw-ob`;
          this.fallbackAudio.onended = () => this.notifySubtitles(null, false);
          this.fallbackAudio.onerror = () => this.playMelodicHint();
          const p = this.fallbackAudio.play();
          if (p !== undefined) {
            p.catch(() => this.playMelodicHint());
          }
        } catch(e) {
          this.playMelodicHint();
        }
      }

      static playMelodicHint() {
        const ctx = SoundFX.init();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          const now = ctx.currentTime;
          osc.frequency.setValueAtTime(783.99, now);
          osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.15);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
          osc.onended = () => osc.disconnect();
        } catch(e){}
      }

      static stop() {
        if (this.synth) {
          try { this.synth.cancel(); } catch(e){}
        }
        if (this.fallbackAudio) {
          try {
            this.fallbackAudio.pause();
            this.fallbackAudio.currentTime = 0;
          } catch(e){}
        }
        this.notifySubtitles(null, false);
      }
    }

    // =========================================================================
    // ENGINE A: SPATIAL & ATTRIBUTE SORTER (Tap-to-Select -> Tap-to-Place)
    // =========================================================================
    const SorterEngine = memo(({ game, onComplete }) => {
      const sorterData = game.data || {};
      const bins = sorterData.bins || [];
      const initialEntities = sorterData.entities || [];

      const [remainingEntities, setRemainingEntities] = useState([]);
      const [selectedEntityId, setSelectedEntityId] = useState(null);
      const [bouncedEntityId, setBouncedEntityId] = useState(null);
      const [sortedCounts, setSortedCounts] = useState({});

      useEffect(() => {
        const shuffled = [...initialEntities].sort(() => Math.random() - 0.5);
        setRemainingEntities(shuffled);
        setSelectedEntityId(shuffled[0]?.id || null);
        const counts = {};
        bins.forEach(b => { counts[b.id] = 0; });
        setSortedCounts(counts);
      }, [game]);

      const activeEntity = remainingEntities.find(e => e.id === selectedEntityId) || remainingEntities[0] || null;

      const handleSelectEntity = (entity) => {
        SoundBus.playPop();
        setSelectedEntityId(entity.id);
      };

      const handlePlaceIntoBin = (bin) => {
        if (!activeEntity) return;

        if (activeEntity.correctBinId === bin.id) {
          SoundBus.playSnap();
          SoundBus.playCoin();
          setSortedCounts(prev => ({
            ...prev,
            [bin.id]: (prev[bin.id] || 0) + 1
          }));

          const nextRemaining = remainingEntities.filter(e => e.id !== activeEntity.id);
          setRemainingEntities(nextRemaining);
          setSelectedEntityId(nextRemaining[0]?.id || null);

          if (nextRemaining.length === 0) {
            SoundBus.playSuccess();
            SoundBus.playStar();
            setTimeout(() => onComplete(120), 1300);
          }
        } else {
          SoundBus.playGentleError();
          setBouncedEntityId(activeEntity.id);
          setTimeout(() => setBouncedEntityId(null), 600);
        }
      };

      return (
        <div className="space-y-6 animate-pop-in">
          {/* Active Item Showcase Card */}

            {activeEntity ? (
              <div className="flex flex-col items-center gap-2">
                <div
                  onClick={() => handleSelectEntity(activeEntity)}
                  className={`transition-all duration-200 flex flex-col items-center gap-2 select-none overflow-visible py-3 px-8 rounded-3xl cursor-pointer ${
                    bouncedEntityId === activeEntity.id
                      ? 'animate-shake ring-4 ring-rose-400 bg-rose-50'
                      : 'ring-4 ring-indigo-500 scale-105 shadow-xl bg-white border-2 border-indigo-400'
                  }`}

                  <span className="text-7xl drop-shadow-sm">{activeEntity.icon}</span>
                  <div className="flex items-center gap-2">

                </div>

                <div className="inline-flex items-center gap-1.5 bg-indigo-50 text-indigo-900 px-4 py-1.5 rounded-full text-xs font-bold font-kantumruy border border-indigo-200 mt-2">
                  <span className="inline-block w-2 h-2 rounded-full bg-indigo-500 animate-ping mr-1" />
                  <span>👆 បានជ្រើសរើស! សូមចុចលើប្រអប់/ធុងខាងក្រោម (Tap Destination Bin)</span>
                </div>
              </div>
            ) : (
              <div className="text-center space-y-2">
                <span className="text-5xl block animate-bounce">🎉</span>
                <h4 className="text-xl font-black text-emerald-900 font-kantumruy leading-relaxed">
                  បានចាត់ថ្នាក់វត្ថុទាំងអស់ជោគជ័យ!
                </h4>
              </div>
            )}
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            {bins.map(bin => {
              const count = sortedCounts[bin.id] || 0;
              return (
                <button
                  key={bin.id}
                  onClick={() => handlePlaceIntoBin(bin)}
                  disabled={!activeEntity}
                  className={`p-5 rounded-3xl text-white font-extrabold shadow-md btn-kid border-b-6 flex flex-col items-center justify-center gap-2 transition-transform active:scale-95 bg-gradient-to-b ${bin.colorClass} border-black/20 hover:scale-104 overflow-visible py-3 cursor-pointer`}
                >
                  <span className="text-4xl">{bin.icon}</span>
                  <h5 className="font-kantumruy font-black text-sm text-center leading-relaxed overflow-visible py-1">
                    {bin.nameKhmer}

                  <span className="text-xs font-mono font-bold bg-white/25 px-3 py-0.5 rounded-full mt-1">
                    ប្រមូលបាន: {count}
                  </span>
                </button>
              );

          <div className="flex items-center justify-between bg-white px-5 py-3 rounded-2xl border-2 border-slate-200 text-xs font-bold text-slate-700">
            <span>នៅសល់៖ <strong className="text-amber-600 text-sm font-mono">{remainingEntities.length}</strong> វត្ថុ</span>
            <span>ចុចលើរូបដើម្បីស្ដាប់បញ្ចេញសំឡេង 🔊</span>
          </div>

    // =========================================================================
    // ENGINE B: ENVIRONMENTAL STATE-MACHINE SANDBOX

    const SandboxEngine = memo(({ game, onComplete }) => {
      const mode = game.data?.mode || 'germination';

      // 1. Plant Germination State
      const [moisture, setMoisture] = useState(40);
      const [sunlight, setSunlight] = useState(35);
      const isThriving = moisture >= 55 && moisture <= 85 && sunlight >= 50 && sunlight <= 85;

      useEffect(() => {
        if (mode === 'germination' && isThriving) {
          const t = setTimeout(() => {
            SoundBus.playSuccess();
            SoundBus.playStar();
            onComplete(120);
          }, 1600);
          return () => clearTimeout(t);
        }
      }, [mode, isThriving, onComplete]);

      // 2. Germ Buster Hand Wash State
      const [germs, setGerms] = useState([
        { id: 1, x: 30, y: 35, health: 100 },
        { id: 2, x: 65, y: 30, health: 100 },
        { id: 3, x: 45, y: 55, health: 100 },
        { id: 4, x: 25, y: 65, health: 100 },
        { id: 5, x: 70, y: 70, health: 100 },
      ]);
      const [soapPos, setSoapPos] = useState({ x: 50, y: 50 });
      const remainingGerms = germs.filter(g => g.health > 0).length;

      const handleScrub = (clientX, clientY, currentTarget) => {
        const rect = currentTarget.getBoundingClientRect();
        const xPct = Math.max(5, Math.min(95, ((clientX - rect.left) / rect.width) * 100));
        const yPct = Math.max(5, Math.min(95, ((clientY - rect.top) / rect.height) * 100));
        setSoapPos({ x: xPct, y: yPct });
        SoundBus.playSoap();

        setGerms(prev => prev.map(g => {
          const dist = Math.hypot(xPct - g.x, yPct - g.y);
          if (dist < 22 && g.health > 0) {
            return { ...g, health: Math.max(0, g.health - 25) };
          }
          return g;
        }));
      };

      useEffect(() => {
        if (mode === 'germ_buster' && remainingGerms === 0) {
          SoundBus.playSuccess();
          SoundBus.playStar();
          const t = setTimeout(() => onComplete(120), 1200);
          return () => clearTimeout(t);
        }
      }, [mode, remainingGerms, onComplete]);

      // 3. Sun & Shadow Dial State
      const [sunAngle, setSunAngle] = useState(45); // 15 to 165
      const rad = (sunAngle * Math.PI) / 180;
      const shadowLength = Math.max(15, Math.min(180, Math.abs(100 / Math.tan(rad))));
      const shadowDirection = sunAngle < 90 ? 1 : -1;

      // 4. Magnetism Explorer State
      const [magnetPos, setMagnetPos] = useState({ x: 120, y: 80 });
      const [magnetItems, setMagnetItems] = useState([
        { id: 1, name: 'ដែកគោល', icon: '🔩', isMagnetic: true, caught: false, x: 60, y: 150 },
        { id: 2, name: 'កូនឃ្នៀបក្រដាស', icon: '📎', isMagnetic: true, caught: false, x: 150, y: 190 },
        { id: 3, name: 'បន្ទាត់ជ័រ', icon: '📏', isMagnetic: false, caught: false, x: 230, y: 140 },
        { id: 4, name: 'ប៊ូតុងឈើ', icon: '🪵', isMagnetic: false, caught: false, x: 80, y: 220 },
        { id: 5, name: 'សោដែក', icon: '🔑', isMagnetic: true, caught: false, x: 200, y: 210 },
      ]);
      const caughtCount = magnetItems.filter(m => m.isMagnetic && m.caught).length;
      const totalMagnetic = magnetItems.filter(m => m.isMagnetic).length;

      const handleMoveMagnet = (clientX, clientY, currentTarget) => {
        const rect = currentTarget.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        setMagnetPos({ x, y });

        setMagnetItems(prev => prev.map(item => {
          if (!item.isMagnetic) return item;
          const dist = Math.hypot(x - item.x, y - item.y);
          if (dist < 65 && !item.caught) {
            SoundBus.playMagnet();
            return { ...item, caught: true, x: x + 15, y: y + 20 };
          }
          if (item.caught) {
            return { ...item, x: x + 15, y: y + 20 };
          }
          return item;
        }));
      };

      useEffect(() => {
        if (mode === 'magnetism' && caughtCount === totalMagnetic && totalMagnetic > 0) {
          SoundBus.playSuccess();
          SoundBus.playStar();
          const t = setTimeout(() => onComplete(120), 1400);
          return () => clearTimeout(t);
        }
      }, [mode, caughtCount, totalMagnetic, onComplete]);

      return (
        <div className="space-y-6 animate-pop-in">
          {/* 1. GERMINATION LAB */}
          {mode === 'germination' && (
            <div className="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
              <div className="md:col-span-7 bg-gradient-to-b from-sky-100 via-amber-50 to-amber-900/20 rounded-3xl p-6 border-4 border-emerald-300 shadow-md min-h-[300px] flex flex-col items-center justify-between relative overflow-hidden">
                <div className="text-8xl mt-10 transition-all duration-500 transform">
                  {!isThriving && moisture < 30 && '🌰'}
                  {!isThriving && moisture >= 30 && moisture < 50 && '🌱'}
                  {!isThriving && moisture >= 50 && '🌿'}
                  {isThriving && '🌻'}
                </div>
                <div className="bg-white/95 px-5 py-2 rounded-2xl border-2 border-emerald-300 text-xs font-bold font-kantumruy shadow-xs mt-4">
                  {isThriving ? '✨ លក្ខខណ្ឌល្អឥតខ្ចោះ! រុក្ខជាតិចេញផ្កាស្រស់ស្អាត!' : '💧 រក្សាតុល្យភាពទឹក និងពន្លឺថ្ងៃ ឲ្យស្ថិតក្នុងចន្លោះ ៥៥ - ៨៥'}

              <div className="md:col-span-5 bg-white p-6 rounded-3xl border-3 border-emerald-200 shadow-sm space-y-5 font-kantumruy">

                    <span className="font-mono text-sm">{moisture}%</span>

                  <input
                    type="range" min="10" max="100" value={moisture}

                    className="w-full h-3 bg-sky-100 rounded-lg cursor-pointer accent-sky-500"
                  />

                <div>
                  <div className="flex justify-between text-xs font-bold text-amber-800 mb-1">
                    <span>☀️ កម្រិតពន្លឺព្រះអាទិត្យ (Sunlight):</span>

                  <input
                    type="range" min="10" max="100" value={sunlight}
                    onChange={e => { SoundBus.playPop(); setSunlight(Number(e.target.value)); }}
                    className="w-full h-3 bg-amber-100 rounded-lg cursor-pointer accent-amber-500"
                  />
                </div>
              </div>
            </div>
          )}

          {/* 2. GERM BUSTER CANVAS */}
          {mode === 'germ_buster' && (
            <div className="space-y-4 font-kantumruy">
              <div
                onMouseMove={e => handleScrub(e.clientX, e.clientY, e.currentTarget)}
                onTouchMove={e => {
                  const touch = e.touches[0];
                  if (touch) handleScrub(touch.clientX, touch.clientY, e.currentTarget);
                }}
                className="bg-gradient-to-b from-sky-50 to-emerald-50 rounded-3xl p-6 border-4 border-sky-300 shadow-inner relative min-h-[320px] overflow-hidden cursor-crosshair select-none flex items-center justify-center"
              >
                <div className="text-9xl opacity-20 pointer-events-none select-none">🖐️</div>

                {germs.map(g => (
                  <div
                    key={g.id}
                    className="absolute flex flex-col items-center pointer-events-none transition-opacity duration-200"
                    style={{ left: `${g.x}%`, top: `${g.y}%`, opacity: g.health / 100, transform: 'translate(-50%, -50%)' }}
                  >
                    <span className="text-4xl animate-pulse">🦠</span>
                    <span className="text-[10px] font-bold bg-white/90 px-1 rounded shadow-xs text-rose-700 font-mono">
                      {g.health}%
                    </span>
                  </div>
                ))}

                <div
                  className="absolute pointer-events-none text-5xl z-20 transition-all duration-75"
                  style={{ left: `${soapPos.x}%`, top: `${soapPos.y}%`, transform: 'translate(-50%, -50%)' }}
                >
                  🧼
                </div>
              </div>

              <div className="bg-white p-4 rounded-2xl border-2 border-sky-200 flex justify-between text-xs font-bold text-slate-700">
                <span>🧼 អូសដុំសាប៊ូដុសលើបាតដៃដើម្បីកម្ចាត់មេរោគ</span>
                <span className="text-sky-700 font-mono text-sm">នៅសល់: {remainingGerms}</span>
              </div>
            </div>
          )}

          {/* 3. SUN & SHADOW DIAL */}
          {mode === 'sun_shadow' && (
            <div className="space-y-4 font-kantumruy">
              <div className="bg-gradient-to-b from-sky-100 to-amber-50 rounded-3xl p-8 border-4 border-amber-300 shadow-inner min-h-[280px] relative flex flex-col justify-end items-center overflow-hidden">
                {/* Sun Vector */}
                <div
                  className="absolute text-5xl transition-all duration-150"
                  style={{
                    left: `${(sunAngle / 180) * 80 + 10}%`,
                    top: `${15 + Math.sin(rad) * -10}%`,
                  }}
                >
                  ☀️
                </div>

                {/* Pagoda Pillar Object */}
                <div className="relative z-10 flex flex-col items-center">
                  <div className="w-8 h-28 bg-amber-800 rounded-t-lg shadow-md border border-amber-950 flex items-center justify-center text-white text-xs font-bold">
                    🏛️
                  </div>
                  <div className="w-16 h-3 bg-amber-950 rounded-full" />
                </div>

                {/* Dynamic Cast Shadow */}
                <div
                  className="absolute bottom-6 bg-slate-900/40 rounded-full blur-[2px] transition-all duration-100"
                  style={{
                    width: `${shadowLength}px`,
                    height: '14px',
                    left: shadowDirection > 0 ? '50%' : `calc(50% - ${shadowLength}px)`,
                    transform: `skewX(${shadowDirection * 25}deg)`,

              <div className="bg-white p-5 rounded-3xl border-3 border-amber-200 space-y-2">
                <div className="flex justify-between text-xs font-bold text-slate-700">
                  <span>📐 មុំនៃព្រះអាទិត្យ (Solar Arc Angle):</span>
                  <span className="font-mono text-sm text-amber-700">{sunAngle}°</span>
                </div>
                <input
                  type="range" min="15" max="165" value={sunAngle}

                />
              </div>
            </div>
          )}

          {/* 4. MAGNETISM LABORATORY */}
          {mode === 'magnetism' && (
            <div className="space-y-4 font-kantumruy">
              <div
                onMouseMove={e => handleMoveMagnet(e.clientX, e.clientY, e.currentTarget)}
                onTouchMove={e => {
                  const touch = e.touches[0];
                  if (touch) handleMoveMagnet(touch.clientX, touch.clientY, e.currentTarget);

              >
                <div
                  className="absolute w-16 h-16 pointer-events-none transition-transform duration-75 z-20 flex items-center justify-center text-4xl drop-shadow-lg"
