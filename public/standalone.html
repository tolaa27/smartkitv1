          <header className="bg-white border-b-2 border-slate-200/80 sticky top-0 z-40 px-4 py-3 sm:px-8 shadow-sm">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              {/* Logo */}
              <div className="flex items-center gap-3 cursor-pointer">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 text-white flex items-center justify-center text-2xl shadow-md border-2 border-white">
                  🇰🇭
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-kantumruy font-black text-xl text-slate-800 tracking-tight">កុមារឆ្លាត</span>
                    <span className="bg-indigo-100 text-indigo-700 text-[10px] font-black px-2 py-0.5 rounded-full font-fredoka uppercase">MoEYS</span>
                  </div>
                  <div className="text-slate-400 text-xs font-fredoka font-bold">SmartKids Cambodia Primary</div>
                </div>
              </div>

              {/* Action Buttons */}
              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  onClick={onToggleMute}
                  className="p-2.5 rounded-2xl border-2 border-slate-200 hover:bg-slate-100 text-slate-700 transition-all"
                  title="បិទ/បើកសំឡេង"
                >
                  {isMuted ? <IconVolumeOff className="w-5 h-5 text-rose-500" /> : <IconVolume className="w-5 h-5 text-indigo-600" />}
                </button>

                <button
                  onClick={onOpenStudio}
                  className="px-4 py-2.5 rounded-2xl bg-indigo-50 border-2 border-indigo-200 hover:bg-indigo-100 text-indigo-700 font-kantumruy font-black text-xs sm:text-sm flex items-center gap-2 transition-all shadow-sm"
                >
                  <IconSparkles className="w-4 h-4 text-indigo-600" />
                  <span className="hidden sm:inline">បង្កើតហ្គេម</span>
                  <span>AI Studio</span>
                </button>

                {/* Profile Pill */}
                <button
                  onClick={onOpenProfile}
                  className="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 p-1.5 pr-3 rounded-2xl transition-all border border-slate-200"
                >
                  <span className="w-8 h-8 rounded-xl bg-white flex items-center justify-center text-lg shadow-sm">
                    {userProfile?.avatar || '🦁'}
                  </span>
                  <div className="text-left hidden md:block">
                    <div className="font-kantumruy font-bold text-xs text-slate-800 leading-none line-clamp-1">{userProfile?.name}</div>
                    <div className="text-[10px] text-amber-600 font-bold font-fredoka leading-none mt-1">⭐ {userProfile?.stars}</div>
                  </div>
                </button>
              </div>
            </div>
          </header>

          {/* Hero Bento Banner */}
          <div className="max-w-7xl mx-auto w-full px-4 sm:px-8 pt-6">
            <div className="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 rounded-3xl p-6 sm:p-8 text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-6 relative overflow-hidden">
              <div className="space-y-3 z-10 max-w-xl">
                <span className="bg-white/20 text-white text-xs font-black font-fredoka px-3 py-1 rounded-full uppercase tracking-wider backdrop-blur-sm">
                  Grades 1–3 MoEYS Interactive Curriculum
                </span>
                <h2 className="text-2xl sm:text-3xl font-black font-kantumruy leading-relaxed">
                  រៀនលេងសប្បាយជាមួយកុមារឆ្លាត! 🌟
                </h2>
                <p className="text-indigo-100 font-kantumruy text-sm sm:text-base leading-relaxed">
                  រៀនអក្សរខ្មែរ គណិតវិទ្យា និងវិទ្យាសាស្ត្រតាមបែបល្បែងអន្តរកម្ម Tactile ប៉ះលេងបានភ្លាមៗ!
                </p>
              </div>

              <div className="flex items-center gap-4 z-10">
                <div className="bg-white/10 backdrop-blur-md p-4 rounded-3xl border border-white/20 text-center min-w-[100px]">
                  <div className="text-3xl font-black font-fredoka">{games.length}</div>
                  <div className="text-xs text-indigo-200 font-kantumruy font-bold">ហ្គេមស្តង់ដារ</div>
                </div>
                <div className="bg-white/10 backdrop-blur-md p-4 rounded-3xl border border-white/20 text-center min-w-[100px]">
                  <div className="text-3xl font-black font-fredoka">5</div>
                  <div className="text-xs text-indigo-200 font-kantumruy font-bold">ប្រព័ន្ធម៉ាស៊ីន</div>
                </div>
              </div>
            </div>
          </div>

          {/* Filter Toolbar */}
          <div className="max-w-7xl mx-auto w-full px-4 sm:px-8 pt-6 space-y-4">
            <div className="flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center">
              {/* Grade Selector */}
              <div className="flex gap-2 overflow-x-auto pb-1">
                {[
                  { id: 'all', label: 'ទាំងអស់ (All)' },
                  { id: '1', label: 'ថ្នាក់ទី១ (G1)' },
                  { id: '2', label: 'ថ្នាក់ទី២ (G2)' },
                  { id: '3', label: 'ថ្នាក់ទី៣ (G3)' },
                ].map(gr => (
                  <button
                    key={gr.id}
                    onClick={() => { SoundBus.playPop(); setSelectedGrade(gr.id); }}
                    className={`px-4 py-2 rounded-2xl font-kantumruy font-bold text-xs sm:text-sm whitespace-nowrap transition-all border-2 ${
                      selectedGrade === gr.id
                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                        : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'
                    }`}
                  >
                    {gr.label}
                  </button>
                ))}
              </div>

              {/* Search Bar */}
              <div className="relative min-w-[260px]">
                <IconSearch className="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="ស្វែងរកហ្គេម (Search)..."
                  className="w-full pl-11 pr-4 py-2.5 rounded-2xl border-2 border-slate-200 bg-white font-kantumruy text-sm font-bold text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-500"
                />
              </div>
            </div>

            {/* Subject Filters */}
            <div className="flex gap-2 overflow-x-auto pb-1">
              {subjectPills.map(sb => (
                <button
                  key={sb.id}
                  onClick={() => { SoundBus.playPop(); setSelectedSubject(sb.id); }}
                  className={`px-4 py-2 rounded-2xl font-kantumruy font-bold text-xs whitespace-nowrap transition-all flex items-center gap-1.5 border ${
                    selectedSubject === sb.id
                      ? 'bg-slate-900 text-white border-slate-900 shadow-sm'
                      : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'
                  }`}
                >
                  <span>{sb.icon}</span>
                  <span>{sb.labelKhmer}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Games Bento Grid */}
          <main className="max-w-7xl mx-auto w-full px-4 sm:px-8 py-6 flex-1">
            {/* Custom Games Section (if any) */}
            {customGames.length > 0 && (
              <div className="mb-8">
                <div className="flex items-center gap-2 mb-4">
                  <span className="text-xl">✨</span>
                  <h3 className="font-kantumruy font-black text-slate-800 text-lg">ហ្គេមផ្ទាល់ខ្លួន AI (My Custom Games)</h3>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  {customGames.map(cg => (
                    <div
                      key={cg.id}
                      onClick={() => { SoundBus.playPop(); onSelectGame(cg); }}
                      className="bg-white rounded-3xl p-5 border-2 border-indigo-200 hover:border-indigo-500 shadow-sm hover:shadow-lg transition-all cursor-pointer flex flex-col justify-between gap-4 group"
                    >
                      <div className="flex items-start justify-between gap-3">
                        <div className="w-14 h-14 rounded-2xl bg-indigo-50 flex items-center justify-center text-3xl group-hover:scale-110 transition-transform">
                          {cg.icon || '🤖'}
                        </div>
                        <span className="bg-indigo-100 text-indigo-700 text-xs font-bold font-fredoka px-2.5 py-1 rounded-xl">
                          AI Custom
                        </span>
                      </div>

                      <div>
                        <h4 className="font-kantumruy font-black text-slate-800 text-base group-hover:text-indigo-600 transition-colors line-clamp-1">
                          {cg.titleKhmer}
                        </h4>
                        <p className="text-xs font-fredoka text-slate-400 font-semibold line-clamp-1">{cg.titleEnglish}</p>
                      </div>

                      <div className="flex items-center justify-between pt-2 border-t border-slate-100 text-xs font-kantumruy text-slate-500">
                        <span>ម៉ាស៊ីន៖ {cg.engineType}</span>
                        <span className="text-indigo-600 font-bold group-hover:translate-x-1 transition-transform">លេង ➔</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Official MoEYS Curriculum Games */}
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-2">
                <span className="text-xl">📚</span>
                <h3 className="font-kantumruy font-black text-slate-800 text-lg">
                  បញ្ជីហ្គេមមេរៀន MoEYS ({filteredGames.length})
                </h3>
              </div>
            </div>

            {filteredGames.length === 0 ? (
              <div className="bg-white rounded-3xl p-12 text-center border-2 border-slate-200 shadow-sm">
                <div className="text-5xl mb-3">🔍</div>
                <h4 className="font-kantumruy font-black text-slate-700 text-lg">មិនមានហ្គេមត្រូវនឹងលក្ខខណ្ឌស្វែងរកទេ</h4>
                <p className="font-kantumruy text-slate-400 text-sm mt-1">សូមជ្រើសរើសថ្នាក់ ឬមុខវិជ្ជាផ្សេងទៀត</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                {filteredGames.map(game => {
                  const subjectBadge = {
                    khmer: { bg: 'bg-emerald-50 text-emerald-700 border-emerald-200', label: 'ភាសាខ្មែរ' },
                    math: { bg: 'bg-amber-50 text-amber-700 border-amber-200', label: 'គណិតវិទ្យា' },
                    science: { bg: 'bg-sky-50 text-sky-700 border-sky-200', label: 'វិទ្យាសាស្ត្រ' },
                  }[game.subject] || { bg: 'bg-slate-50 text-slate-700 border-slate-200', label: 'ទូទៅ' };

                  return (
                    <div
                      key={game.id}
                      onClick={() => { SoundBus.playPop(); onSelectGame(game); }}
                      className="bg-white rounded-3xl p-6 border-2 border-slate-200/80 hover:border-indigo-500 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer flex flex-col justify-between gap-4 group"
                    >
                      <div className="flex items-start justify-between gap-3">
                        <div className="w-16 h-16 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center text-3xl group-hover:scale-110 transition-transform shadow-inner">
                          {game.icon}
                        </div>

                        <div className="flex flex-col items-end gap-1.5">
                          <span className={`text-[11px] font-kantumruy font-bold px-2.5 py-0.5 rounded-full border ${subjectBadge.bg}`}>
                            {subjectBadge.label}
                          </span>
                          <span className="text-[10px] font-fredoka font-black text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">
                            Grade {game.grade}
                          </span>
                        </div>
                      </div>

                      <div>
                        <h4 className="font-kantumruy font-black text-slate-800 text-base sm:text-lg group-hover:text-indigo-600 transition-colors leading-snug line-clamp-1">
                          {game.titleKhmer}
                        </h4>
                        <p className="text-xs font-fredoka text-slate-400 font-semibold line-clamp-1 mt-0.5">
                          {game.titleEnglish}
                        </p>
                      </div>

                      <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                        <span className="text-[11px] font-fredoka font-bold uppercase text-slate-400">
                          {game.engineType.replace('_', ' ')}
                        </span>

                        <div className="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-colors shadow-sm">
                          <IconPlay className="w-4 h-4 ml-0.5" />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-white border-t-2 border-slate-200/80 py-6 px-4 text-center">
            <p className="font-kantumruy font-bold text-slate-500 text-xs sm:text-sm">
              កម្មវិធីអប់រំកុមារឆ្លាត (SmartKids Cambodia) • ស្របតាមកម្មវិធីសិក្សាបឋមសិក្សា MoEYS
            </p>
            <p className="font-fredoka text-slate-400 text-xs mt-1">
              Zero-Dependency Standalone React 19 Engine • Tactile Touch-First Learning
            </p>
          </footer>
        </div>
      );
    });

    // =========================================================================
    // ROOT APP COMPONENT (State Wiring & Persistence)
    // =========================================================================
    const App = () => {
      const [view, setView] = useState('hub'); // 'hub' | 'runner'
      const [activeGame, setActiveGame] = useState(null);
      const [isMuted, setIsMuted] = useState(false);
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [showStudioModal, setShowStudioModal] = useState(false);

      const [userProfile, setUserProfile] = useState(() => {
        try {
          const saved = localStorage.getItem('smartkids_user');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return { name: 'កុមារឆ្លាត', avatar: '🦁', stars: 240 };
      });

      const [customGames, setCustomGames] = useState(() => {
        try {
          const saved = localStorage.getItem('smartkids_custom_games');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return [];
      });

      const handleToggleMute = useCallback(() => {
        const next = SoundFX.toggleMute();
        setIsMuted(next);
      }, []);

      const handleSelectGame = useCallback((game) => {
        setActiveGame(game);
        setView('runner');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, []);

      const handleBackToHub = useCallback(() => {
        SoundBus.playPop();
        setView('hub');
        setActiveGame(null);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, []);

      const handleCompleteLevel = useCallback((points = 100) => {
        setUserProfile(prev => {
          const next = { ...prev, stars: prev.stars + 3 };
          try {
            localStorage.setItem('smartkids_user', JSON.stringify(next));
          } catch (e) {}
          return next;
        });
      }, []);

      const handleSaveProfile = useCallback((newProfile) => {
        setUserProfile(newProfile);
        try {
          localStorage.setItem('smartkids_user', JSON.stringify(newProfile));
        } catch (e) {}
      }, []);

      const handleSaveCustomGame = useCallback((newGame) => {
        setCustomGames(prev => {
          const next = [newGame, ...prev];
          try {
            localStorage.setItem('smartkids_custom_games', JSON.stringify(next));
          } catch (e) {}
          return next;
        });
      }, []);

      return (
        <div className="min-h-screen text-slate-800 selection:bg-indigo-100 selection:text-indigo-900">
          {view === 'hub' ? (
            <GameHub
              games={CURRICULUM_GAMES}
              customGames={customGames}
              onSelectGame={handleSelectGame}
              userProfile={userProfile}
              onOpenProfile={() => { SoundBus.playPop(); setShowProfileModal(true); }}
              onOpenStudio={() => { SoundBus.playPop(); setShowStudioModal(true); }}
              isMuted={isMuted}
              onToggleMute={handleToggleMute}
            />
          ) : (
            <UniversalGameRunner
              game={activeGame}
              onBack={handleBackToHub}
              onCompleteLevel={handleCompleteLevel}
              currentStars={userProfile.stars}
            />
          )}

          {/* Profile Modal */}
          <AvatarModal
            isOpen={showProfileModal}
            onClose={() => setShowProfileModal(false)}
            currentProfile={userProfile}
            onSaveProfile={handleSaveProfile}
          />

          {/* AI Studio Modal */}
          <AIGameStudioModal
            isOpen={showStudioModal}
            onClose={() => setShowStudioModal(false)}
            onSaveCustomGame={handleSaveCustomGame}
          />

          {/* Floating Subtitle Voice Feedback Banner */}
          <SubtitleBanner />
        </div>
      );
    };

    // =========================================================================
    // MOUNT TO DOM
    // =========================================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
