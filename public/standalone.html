                >
                  🧲
                </div>

                {magnetItems.map(item => (
                  <div
                    key={item.id}
                    className={`absolute p-2 rounded-xl border flex items-center gap-1 font-kantumruy text-xs font-bold ${
                      item.caught ? 'bg-rose-100 border-rose-400 text-rose-950 scale-110 shadow-md' : 'bg-white border-slate-200 text-slate-700'
                    }`}
                    style={{ left: `${item.x}px`, top: `${item.y}px` }}
                  >
                    <span className="text-2xl">{item.icon}</span>
                    <span>{item.name}</span>
                  </div>
                ))}
              </div>

              <div className="bg-white p-4 rounded-2xl border-2 border-rose-200 flex justify-between text-xs font-bold text-slate-700">
                <span>🧲 អូសមេដែកកាត់លើតុដើម្បីស្រូបវត្ថុធ្វើពីដែក</span>
                <span className="text-rose-700 font-mono text-sm">ស្រូបបាន: {caughtCount}/{totalMagnetic}</span>
              </div>
            </div>
          )}
        </div>
      );
    });

    // =========================================================================
    // ENGINE C: CONCRETE-REPRESENTATIONAL-ABSTRACT MATH LAB (CRA)
    // =========================================================================
    const MathCraEngine = memo(({ game, onComplete }) => {
      const mode = game.data?.mode || 'market_cashier';

      // --- Mode 1: Cambodian Market Cashier ---
      const MarketCashier = () => {
        const targetTotal = game.data?.targetTotal || 3500;
        const [paidNotes, setPaidNotes] = useState([]);
        const [isSuccess, setIsSuccess] = useState(false);
        const [feedbackMsg, setFeedbackMsg] = useState('');

        const banknotes = [
          { val: 100, label: '១០០៛', color: 'bg-amber-50 border-amber-300 text-amber-900 hover:bg-amber-100', icon: '💵' },
          { val: 500, label: '៥០០៛', color: 'bg-rose-50 border-rose-300 text-rose-900 hover:bg-rose-100', icon: '💵' },
          { val: 1000, label: '១,០០០៛', color: 'bg-sky-50 border-sky-300 text-sky-900 hover:bg-sky-100', icon: '💴' },
          { val: 2000, label: '២,០០០៛', color: 'bg-yellow-50 border-yellow-300 text-yellow-900 hover:bg-yellow-100', icon: '💴' },
          { val: 5000, label: '៥,០០០៛', color: 'bg-emerald-50 border-emerald-300 text-emerald-900 hover:bg-emerald-100', icon: '💶' },
          { val: 10000, label: '១០,០០០៛', color: 'bg-indigo-50 border-indigo-300 text-indigo-900 hover:bg-indigo-100', icon: '💷' },
        ];

        const currentPaidSum = paidNotes.reduce((sum, n) => sum + n.val, 0);

        const handleAddNote = (note) => {
          if (isSuccess) return;
          SoundBus.playCoin();
          setPaidNotes(prev => [...prev, { ...note, uniqueId: Math.random() }]);
          setFeedbackMsg('');
        };

        const handleRemoveNote = (uniqueId) => {
          if (isSuccess) return;
          SoundBus.playPop();
          setPaidNotes(prev => prev.filter(n => n.uniqueId !== uniqueId));
          setFeedbackMsg('');
        };

        const handleReset = () => {
          SoundBus.playPop();
          setPaidNotes([]);
          setFeedbackMsg('');
        };

        const handleVerifyPayment = () => {
          if (currentPaidSum === targetTotal) {
            SoundBus.playCashDrawer();
            SoundBus.playSuccess();
            SoundBus.playStar();
            setIsSuccess(true);
            setFeedbackMsg('🎉 ត្រឹមត្រូវល្អណាស់! អ្នកបានទូទាត់ប្រាក់គ្រប់ចំនួន!');
            setTimeout(() => onComplete(100), 1400);
          } else if (currentPaidSum < targetTotal) {
            SoundBus.playGentleError();
            setFeedbackMsg('⚠️ ខ្វះប្រាក់ ' + toKhmerNumeral(targetTotal - currentPaidSum) + '៛ ទៀត! សូមថែមក្រដាសប្រាក់');
          } else {
            SoundBus.playGentleError();
            setFeedbackMsg('⚠️ លើសប្រាក់ ' + toKhmerNumeral(currentPaidSum - targetTotal) + '៛! សូមដកក្រដាសប្រាក់ចេញខ្លះ');
          }
        };

        return (
          <div className="space-y-6">
            {/* Target Display Shelf */}
            <div className="bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 p-5 rounded-3xl text-white shadow-lg flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-4">
                <div className="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-4xl shadow-inner backdrop-blur-sm">
                  🧺
                </div>
                <div>
                  <div className="text-amber-100 text-xs font-bold uppercase tracking-wider font-fredoka">Cambodian Fresh Market</div>
                  <div className="text-xl font-black font-kantumruy">ទំនិញ៖ ផ្លែចេកទុំ ១ស្និត</div>
                </div>
              </div>

              <div className="bg-white/20 px-6 py-3 rounded-2xl border border-white/30 backdrop-blur-sm text-center">
                <div className="text-xs text-amber-100 font-bold font-kantumruy">តម្លៃត្រូវទូទាត់សរុប</div>
                <div className="text-3xl font-black font-kantumruy tracking-tight">
                  {toKhmerNumeral(targetTotal)} <span className="text-2xl font-bold font-kantumruy">៛</span>
                </div>
              </div>
            </div>

            {/* Payment Counter Tray */}
            <div className="bg-white p-6 rounded-3xl border-2 border-slate-200/80 shadow-sm">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">🪙</span>
                  <h3 className="font-kantumruy font-bold text-slate-800 text-lg">ថាសប្រាក់បានបង់ (ចុចលើក្រដាសដើម្បីដកចេញ)</h3>
                </div>
                <div className="font-kantumruy text-sm font-bold text-slate-600">
                  សរុបបានបង់: <span className={'text-lg font-black font-mono ' + (currentPaidSum === targetTotal ? 'text-emerald-600' : 'text-amber-600')}>
                    {toKhmerNumeral(currentPaidSum)}៛
                  </span>
                </div>
              </div>

              <div className="min-h-[120px] bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-4 flex flex-wrap gap-3 items-center justify-center">
                {paidNotes.length === 0 ? (
                  <div className="text-slate-400 font-kantumruy text-sm italic">
                    ថាសប្រាក់នៅទទេ! សូមចុចជ្រើសរើសក្រដាសប្រាក់ខាងក្រោមដើម្បីដាក់បង់...
                  </div>
                ) : (
                  paidNotes.map(note => (
                    <button
                      key={note.uniqueId}
                      onClick={() => handleRemoveNote(note.uniqueId)}
                      className={'px-4 py-2.5 rounded-xl border-2 font-kantumruy font-black text-sm shadow-sm transition-transform active:scale-95 flex items-center gap-1.5 ' + note.color}
                    >
                      <span>{note.icon}</span>
                      <span>{note.label}</span>
                      <span className="text-rose-500 font-bold ml-1 text-xs">✕</span>
                    </button>
                  ))
                )}
              </div>

              {feedbackMsg && (
                <div className={'mt-3 p-3 rounded-xl font-kantumruy text-sm font-bold text-center ' + (
                  isSuccess ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-amber-50 text-amber-800 border border-amber-300'
                )}>
                  {feedbackMsg}
                </div>
              )}

              <div className="flex gap-3 mt-4">
                <button
                  onClick={handleReset}
                  className="px-5 py-3 rounded-2xl border-2 border-slate-200 text-slate-600 font-kantumruy font-bold hover:bg-slate-100 transition-colors"
                >
                  សម្អាតថាស
                </button>
                <button
                  onClick={handleVerifyPayment}
                  disabled={isSuccess || paidNotes.length === 0}
                  className={'flex-1 py-3 rounded-2xl font-kantumruy font-black text-base text-white shadow-md transition-all flex items-center justify-center gap-2 ' + (
                    isSuccess || paidNotes.length === 0
                      ? 'bg-slate-300 cursor-not-allowed'
                      : 'bg-emerald-600 hover:bg-emerald-700 active:scale-98 shadow-emerald-200'
                  )}
                >
                  <IconCheck className="w-5 h-5" />
                  <span>ទូទាត់ប្រាក់ (Verify Cash)</span>
                </button>
              </div>
            </div>

            {/* Banknotes Selection Deck */}
            <div className="bg-slate-100/80 p-6 rounded-3xl border-2 border-slate-200/80">
              <div className="text-xs font-bold text-slate-500 uppercase tracking-wider font-fredoka mb-3">
                កាបូបក្រដាសប្រាក់រៀល (Tap Banknote to Pay)
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                {banknotes.map(note => (
                  <button
                    key={note.val}
                    onClick={() => handleAddNote(note)}
                    disabled={isSuccess}
                    className={'p-4 rounded-2xl border-2 font-kantumruy font-black text-base shadow-sm transition-all hover:scale-105 active:scale-95 flex flex-col items-center gap-1 ' + note.color}
                  >
                    <span className="text-3xl">{note.icon}</span>
                    <span>{note.label}</span>
                    <span className="text-xs font-mono opacity-60 font-normal">+{note.val}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      };

      // --- Mode 2: Dual-Pan Balance Scale ---
      const BalanceScale = () => {
        const leftKnown = game.data?.leftKnown || 4;
        const rightTarget = game.data?.rightTarget || 9;
        const [leftAdded, setLeftAdded] = useState([]);
        const [isSuccess, setIsSuccess] = useState(false);
        const [feedbackMsg, setFeedbackMsg] = useState('');

        const weightsBank = [1, 2, 3, 5];

        const leftTotal = leftKnown + leftAdded.reduce((sum, w) => sum + w.val, 0);
        const diff = leftTotal - rightTarget;
        const tiltDeg = Math.max(-14, Math.min(14, diff * 3.5));

        const handleAddWeight = (val) => {
          if (isSuccess) return;
          SoundBus.playSnap();
          setLeftAdded(prev => [...prev, { val, id: Math.random() }]);
          setFeedbackMsg('');
        };

        const handleRemoveWeight = (id) => {
          if (isSuccess) return;
          SoundBus.playPop();
          setLeftAdded(prev => prev.filter(w => w.id !== id));
          setFeedbackMsg('');
        };

        const handleVerify = () => {
          if (leftTotal === rightTarget) {
            SoundBus.playSuccess();
            SoundBus.playStar();
            setIsSuccess(true);
            setFeedbackMsg('🎉 តុល្យភាពស្មើគ្នា! ជញ្ជីងមានលំនឹងត្រឹមត្រូវ!');
            setTimeout(() => onComplete(100), 1400);
          } else if (leftTotal < rightTarget) {
            SoundBus.playGentleError();
            setFeedbackMsg('⚠️ ជញ្ជីងខាងឆ្វេងស្រាលជាង! សូមថែមទម្ងន់ទៀត');
          } else {
            SoundBus.playGentleError();
            setFeedbackMsg('⚠️ ជញ្ជីងខាងឆ្វេងធ្ងន់ជាងហើយ! សូមដកទម្ងន់ចេញខ្លះ');
          }
        };

        return (
          <div className="space-y-6">
            {/* Equation HUD */}
            <div className="bg-white p-5 rounded-3xl border-2 border-slate-200/80 shadow-sm flex items-center justify-center gap-3 text-2xl font-black font-kantumruy text-slate-800">
              <span className="text-indigo-600 bg-indigo-50 px-4 py-2 rounded-2xl border border-indigo-200">{toKhmerNumeral(leftKnown)}</span>
              <span>+</span>
              <span className="text-amber-600 bg-amber-50 px-4 py-2 rounded-2xl border-2 border-dashed border-amber-300 min-w-[50px] text-center">
                {leftAdded.length > 0 ? toKhmerNumeral(leftAdded.reduce((s, w) => s + w.val, 0)) : '?'}
              </span>
              <span>=</span>
              <span className="text-emerald-600 bg-emerald-50 px-4 py-2 rounded-2xl border border-emerald-200">{toKhmerNumeral(rightTarget)}</span>
            </div>

            {/* Interactive Scale Graphic */}
            <div className="bg-gradient-to-b from-sky-50 to-slate-100 p-8 rounded-3xl border-2 border-slate-200 relative overflow-hidden min-h-[300px] flex flex-col items-center justify-between">
              <div className="w-full max-w-md relative pt-6">
                {/* Horizontal Beam */}
                <div
                  className="h-3 bg-slate-700 rounded-full w-full transition-transform duration-500 ease-out relative shadow-md"
                  style={{ transform: 'rotate(' + tiltDeg + 'deg)' }}
                >
                  {/* Left Pan Attachment */}
                  <div className="absolute left-4 -bottom-2 w-1 h-14 bg-slate-400">
                    <div className="absolute -bottom-8 -left-12 w-28 h-12 bg-white/90 border-2 border-indigo-300 rounded-b-3xl shadow-md p-1 flex flex-wrap gap-1 items-center justify-center overflow-visible">
                      <span className="bg-indigo-500 text-white font-bold text-xs px-1.5 py-0.5 rounded-md">{toKhmerNumeral(leftKnown)}</span>
                      {leftAdded.map(w => (
                        <span key={w.id} onClick={() => handleRemoveWeight(w.id)} className="bg-amber-500 text-white font-bold text-xs px-1.5 py-0.5 rounded-md cursor-pointer hover:bg-rose-500">
                          {toKhmerNumeral(w.val)}
                        </span>
                      ))}
                    </div>
                  </div>

                  {/* Right Pan Attachment */}
                  <div className="absolute right-4 -bottom-2 w-1 h-14 bg-slate-400">
                    <div className="absolute -bottom-8 -right-12 w-28 h-12 bg-white/90 border-2 border-emerald-300 rounded-b-3xl shadow-md p-1 flex items-center justify-center">
                      <span className="bg-emerald-600 text-white font-black text-sm px-3 py-1 rounded-xl shadow-sm">
                        {toKhmerNumeral(rightTarget)}
                      </span>
                    </div>
                  </div>
                </div>

                {/* Fulcrum Stand */}
                <div className="w-0 h-0 border-l-[25px] border-l-transparent border-r-[25px] border-r-transparent border-b-[50px] border-b-slate-800 mx-auto -mt-1 shadow-lg" />
                <div className="w-32 h-3 bg-slate-700 rounded-full mx-auto shadow-md" />
              </div>

              {/* Balance State Badge */}
              <div className="mt-8 text-center font-kantumruy">
                {leftTotal === rightTarget ? (
                  <span className="inline-flex items-center gap-1.5 bg-emerald-100 border border-emerald-300 text-emerald-800 px-4 py-1.5 rounded-full font-bold text-sm">
                    ⚖️ មានតុល្យភាពស្មើគ្នា (Balanced)
                  </span>
                ) : (
                  <span className="inline-flex items-center gap-1.5 bg-slate-200 text-slate-700 px-4 py-1.5 rounded-full font-bold text-sm">
                    {leftTotal > rightTarget ? 'ជញ្ជីងខាងឆ្វេងធ្ងន់ជាង ⬇️' : 'ជញ្ជីងខាងឆ្វេងស្រាលជាង ⬆️'}
                  </span>
                )}
              </div>
            </div>

            {feedbackMsg && (
              <div className={'p-3 rounded-2xl font-kantumruy text-sm font-bold text-center ' + (
                isSuccess ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-amber-50 text-amber-800 border border-amber-300'
              )}>
                {feedbackMsg}
              </div>
            )}

            {/* Weights Selector */}
            <div className="bg-white p-5 rounded-3xl border-2 border-slate-200/80 shadow-sm">
              <div className="text-xs font-bold text-slate-500 uppercase tracking-wider font-fredoka mb-3">
                ជ្រើសរើសទម្ងន់ដាក់ចូលជញ្ជីងខាងឆ្វេង (Tap Weight to Add)
              </div>
              <div className="grid grid-cols-4 gap-3">
                {weightsBank.map(val => (
                  <button
                    key={val}
                    onClick={() => handleAddWeight(val)}
                    disabled={isSuccess}
                    className="p-4 rounded-2xl bg-amber-50 border-2 border-amber-300 hover:bg-amber-100 active:scale-95 text-amber-950 font-kantumruy font-black text-xl flex flex-col items-center gap-1 shadow-sm transition-transform"
                  >
                    <span className="text-2xl">⚖️</span>
                    <span>+{toKhmerNumeral(val)}</span>
                  </button>
                ))}
              </div>

              <div className="flex gap-3 mt-4">
                <button
                  onClick={() => { SoundBus.playPop(); setLeftAdded([]); setFeedbackMsg(''); }}
                  className="px-5 py-3 rounded-2xl border-2 border-slate-200 text-slate-600 font-kantumruy font-bold hover:bg-slate-100"
                >
                  សម្អាត
                </button>
                <button
                  onClick={handleVerify}
                  disabled={isSuccess || leftAdded.length === 0}
                  className={'flex-1 py-3 rounded-2xl font-kantumruy font-black text-base text-white shadow-md flex items-center justify-center gap-2 ' + (
                    isSuccess || leftAdded.length === 0 ? 'bg-slate-300 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 active:scale-98'
                  )}
                >
                  <IconCheck className="w-5 h-5" />
                  <span>ផ្ទៀងផ្ទាត់តុល្យភាព (Verify)</span>
                </button>
              </div>
            </div>
          </div>
        );
      };

      // --- Mode 3: Frog Hopper on Number Line ---
      const FrogHopper = () => {
        const startNum = game.data?.startNum || 6;
        const addNum = game.data?.addNum || 7;
        const targetNum = startNum + addNum;
        const [currentPos, setCurrentPos] = useState(startNum);
        const [isSuccess, setIsSuccess] = useState(false);

        const handleHop = (delta) => {
          if (isSuccess) return;
          const next = Math.max(0, Math.min(20, currentPos + delta));
          setCurrentPos(next);
          SoundBus.playPop();

          if (next === targetNum) {
            SoundBus.playSuccess();
            SoundBus.playStar();
            setIsSuccess(true);
            setTimeout(() => onComplete(100), 1400);
          }
        };

        const handleReset = () => {
          SoundBus.playPop();
          setCurrentPos(startNum);
        };

        return (
          <div className="space-y-6">
            {/* Target Equation Display */}
            <div className="bg-emerald-500 p-5 rounded-3xl text-white shadow-md flex items-center justify-between">
              <div>
                <div className="text-emerald-100 text-xs font-bold uppercase tracking-wider font-fredoka">Number Line Hopper</div>
                <div className="text-2xl font-black font-kantumruy">
                  {toKhmerNumeral(startNum)} + {toKhmerNumeral(addNum)} = ?
                </div>
              </div>
              <div className="bg-white/20 px-4 py-2 rounded-2xl font-kantumruy font-bold text-sm backdrop-blur-sm">
                គោលដៅ៖ លោតឲ្យដល់ {toKhmerNumeral(targetNum)}
              </div>
            </div>

            {/* Number Line Stage */}
            <div className="bg-white p-8 rounded-3xl border-2 border-slate-200/80 shadow-sm relative overflow-x-auto min-h-[220px] flex flex-col justify-end">
              {/* Frog Sprite */}
              <div
                className="absolute top-8 transition-all duration-300 ease-out flex flex-col items-center"
                style={{
                  left: 'calc(' + ((currentPos / 20) * 88) + '% + 16px)',
                  transform: 'translateX(-50%)'
                }}
              >
                <div className="text-4xl">🐸</div>
                <div className="bg-indigo-600 text-white font-mono font-bold text-xs px-2 py-0.5 rounded-full shadow-sm">
                  {toKhmerNumeral(currentPos)}
                </div>
              </div>

              {/* The Line */}
              <div className="relative w-full h-3 bg-slate-300 rounded-full flex justify-between items-center px-1">
                {Array.from({ length: 21 }, (_, i) => (
                  <div key={i} className="flex flex-col items-center relative -top-3">
                    <div className={'w-1 ' + (i % 5 === 0 ? 'h-6 bg-slate-700' : 'h-3 bg-slate-400') + ' rounded-full'} />
                    <span className={'font-kantumruy text-xs mt-1 ' + (i === targetNum ? 'text-emerald-600 font-black scale-125' : 'text-slate-500')}>
                      {toKhmerNumeral(i)}
                    </span>
                  </div>
                ))}
              </div>
            </div>

            {/* Hop Controls */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <button
                onClick={() => handleHop(1)}
                disabled={isSuccess || currentPos >= 20}
                className="p-4 rounded-2xl bg-emerald-50 border-2 border-emerald-300 hover:bg-emerald-100 text-emerald-900 font-kantumruy font-black text-base active:scale-95 shadow-sm transition-transform"
              >
                លោតទៅមុខ +១
              </button>
              <button
                onClick={() => handleHop(5)}
                disabled={isSuccess || currentPos + 5 > 20}
                className="p-4 rounded-2xl bg-teal-50 border-2 border-teal-300 hover:bg-teal-100 text-teal-900 font-kantumruy font-black text-base active:scale-95 shadow-sm transition-transform"
              >
                លោតទៅមុខ +៥
              </button>
              <button
                onClick={() => handleHop(-1)}
                disabled={isSuccess || currentPos <= 0}
                className="p-4 rounded-2xl bg-rose-50 border-2 border-rose-300 hover:bg-rose-100 text-rose-900 font-kantumruy font-black text-base active:scale-95 shadow-sm transition-transform"
              >
                ថយក្រោយ -១
              </button>
              <button
                onClick={handleReset}
                disabled={isSuccess}
                className="p-4 rounded-2xl bg-slate-100 border-2 border-slate-300 hover:bg-slate-200 text-slate-700 font-kantumruy font-black text-base active:scale-95 shadow-sm transition-transform"
              >
                កំណត់ឡើងវិញ
              </button>
            </div>
          </div>
        );
      };

      // --- Mode 4: Fair-Share Physical Division ---
      const FairShare = () => {
        const totalItems = game.data?.totalItems || 12;
        const basketsCount = game.data?.basketsCount || 3;
        const targetPerBasket = Math.floor(totalItems / basketsCount);

        const [unassignedCount, setUnassignedCount] = useState(totalItems);
        const [baskets, setBaskets] = useState(() => Array(basketsCount).fill(0));
        const [isSuccess, setIsSuccess] = useState(false);
        const [feedbackMsg, setFeedbackMsg] = useState('');

        const handleAddToBasket = (basketIdx) => {
          if (isSuccess || unassignedCount <= 0) return;
          SoundBus.playSnap();
          setUnassignedCount(prev => prev - 1);
          setBaskets(prev => {
            const next = [...prev];
            next[basketIdx] += 1;
            return next;
          });
          setFeedbackMsg('');
        };

        const handleRemoveFromBasket = (basketIdx) => {
          if (isSuccess || baskets[basketIdx] <= 0) return;
          SoundBus.playPop();
          setUnassignedCount(prev => prev + 1);
          setBaskets(prev => {
            const next = [...prev];
            next[basketIdx] -= 1;
            return next;
          });
          setFeedbackMsg('');
        };

        const handleVerify = () => {
          const isAllAssigned = unassignedCount === 0;
          const isAllEqual = baskets.every(count => count === targetPerBasket);

          if (isAllAssigned && isAllEqual) {
            SoundBus.playSuccess();
            SoundBus.playStar();
            setIsSuccess(true);
            setFeedbackMsg('🎉 ចែកស្មើគ្នាបានល្អណាស់! ក្នុងមួយកន្ត្រកមាន ' + toKhmerNumeral(targetPerBasket) + ' ផ្លែ!');
            setTimeout(() => onComplete(100), 1400);
          } else if (!isAllAssigned) {
            SoundBus.playGentleError();
            setFeedbackMsg('⚠️ នៅសល់ផ្លែឈើ ' + toKhmerNumeral(unassignedCount) + ' ផ្លែទៀតមិនទាន់បានចែក!');
          } else {
            SoundBus.playGentleError();
            setFeedbackMsg('⚠️ ចំនួនផ្លែឈើក្នុងកន្ត្រកមិនទាន់ស្មើគ្នាទេ! សូមពិនិត្យឡើងវិញ');
          }
        };

        return (
          <div className="space-y-6">
            {/* Unassigned Fruit Pile */}
            <div className="bg-white p-6 rounded-3xl border-2 border-slate-200/80 shadow-sm text-center">
              <div className="flex items-center justify-between mb-3">
                <div className="font-kantumruy font-bold text-slate-800 text-base">
                  ផ្លែឈើនៅសល់ (Unassigned Mangoes)
                </div>
                <div className="font-kantumruy font-bold text-amber-600 bg-amber-50 px-3 py-1 rounded-xl border border-amber-200 text-sm">
                  នៅសល់៖ {toKhmerNumeral(unassignedCount)} / {toKhmerNumeral(totalItems)}
                </div>
              </div>

              <div className="min-h-[70px] bg-amber-50/50 rounded-2xl border-2 border-dashed border-amber-200 p-4 flex flex-wrap gap-2 items-center justify-center">
                {Array.from({ length: unassignedCount }, (_, i) => (
                  <span key={i} className="text-3xl cursor-pointer">🥭</span>
                ))}
              </div>
            </div>

            {/* Baskets Grid */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {baskets.map((count, idx) => (
                <div
                  key={idx}
                  className="bg-white p-5 rounded-3xl border-2 border-slate-200/80 shadow-sm flex flex-col items-center justify-between gap-4"
                >
                  <div className="font-kantumruy font-bold text-slate-700 text-sm">
                    កន្ត្រកទី {toKhmerNumeral(idx + 1)}
                  </div>

                  <div className="w-full min-h-[100px] bg-slate-50 border-2 border-slate-200 rounded-2xl p-3 flex flex-wrap gap-1.5 items-center justify-center">
                    {Array.from({ length: count }, (_, i) => (
                      <span
                        key={i}
                        onClick={() => handleRemoveFromBasket(idx)}
                        className="text-2xl cursor-pointer hover:scale-125 transition-transform"
                        title="ចុចដើម្បីដកចេញ"
                      >
                        🥭
                      </span>
                    ))}
                  </div>

                  <div className="font-kantumruy font-black text-base text-slate-800">
                    {toKhmerNumeral(count)} ផ្លែ
                  </div>

                  <div className="flex gap-2 w-full">
                    <button
                      onClick={() => handleRemoveFromBasket(idx)}
                      disabled={isSuccess || count <= 0}
                      className="flex-1 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-kantumruy font-bold text-xs"
                    >
                      - ដកចេញ
                    </button>
                    <button
                      onClick={() => handleAddToBasket(idx)}
                      disabled={isSuccess || unassignedCount <= 0}
                      className="flex-1 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-kantumruy font-bold text-xs shadow-sm"
                    >
                      + ដាក់ចូល
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {feedbackMsg && (
              <div className={'p-3 rounded-2xl font-kantumruy text-sm font-bold text-center ' + (
                isSuccess ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-amber-50 text-amber-800 border border-amber-300'
              )}>
                {feedbackMsg}
              </div>
            )}

            <div className="flex justify-end">
              <button
                onClick={handleVerify}
                disabled={isSuccess}
                className="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-kantumruy font-black text-base shadow-md flex items-center justify-center gap-2"
              >
                <IconCheck className="w-5 h-5" />
                <span>ផ្ទៀងផ្ទាត់ការចែកស្មើ (Verify Fair Share)</span>
              </button>
            </div>
          </div>
        );
      };

      return (
        <div>
          {mode === 'market_cashier' && <MarketCashier />}
          {mode === 'balance_scale' && <BalanceScale />}
          {mode === 'frog_hopper' && <FrogHopper />}
          {mode === 'fair_share' && <FairShare />}
        </div>
      );
    });

    // =========================================================================
    // ENGINE D: KHMER PHONETICS & SYNTAX RAILROAD
    // =========================================================================
    const KhmerPhoneticsEngine = memo(({ game, onComplete }) => {
      const mode = game.data?.mode || 'syllable_constructor';

      // --- Mode 1: Syllable Constructor ---
      const SyllableConstructor = () => {
        const targetWord = game.data?.targetWord || 'ក្ងា';
        const expectedBase = game.data?.base || 'ក';
        const expectedSub = game.data?.sub || '្ង';
        const expectedVowel = game.data?.vowel || 'ា';

        const [selectedBase, setSelectedBase] = useState('');
        const [selectedSub, setSelectedSub] = useState('');
        const [selectedVowel, setSelectedVowel] = useState('');
        const [isSuccess, setIsSuccess] = useState(false);
        const [feedbackMsg, setFeedbackMsg] = useState('');

        const baseConsonants = ['ក', 'ខ', 'គ', 'ច', 'ត', 'ន', 'ស'];
        const subscripts = ['្ង', '្ម', '្រ', '្ល', '្វ'];
        const vowels = ['ា', 'ិ', 'ី', 'ឹ', 'ឺ', 'ូ', 'ៅ'];

        const assembledWord = selectedBase + selectedSub + selectedVowel;

        const handleSpeakWord = () => {
          if (assembledWord) {
            SpeechEngine.speak(assembledWord, 'km-KH');
          }
        };

        const handleVerify = () => {
          if (selectedBase === expectedBase && selectedSub === expectedSub && selectedVowel === expectedVowel) {
            SoundBus.playSuccess();
            SoundBus.playStar();
            setIsSuccess(true);
            setFeedbackMsg('🎉 ត្រឹមត្រូវល្អណាស់! ពាក្យ «' + targetWord + '» ផ្គុំជោគជ័យ!');
            SpeechEngine.speak(targetWord, 'km-KH');
            setTimeout(() => onComplete(100), 1500);
          } else {
            SoundBus.playGentleError();
            setFeedbackMsg('⚠️ ពាក្យមិនទាន់ត្រឹមត្រូវទេ! សូមពិនិត្យព្យញ្ជនៈ ជើង និងស្រៈឡើងវិញ');
          }
        };

        return (
          <div className="space-y-6">
            {/* Assembled Word Forge Display */}
            <div className="bg-white p-8 rounded-3xl border-2 border-slate-200/80 shadow-sm flex flex-col items-center justify-center gap-4">
              <div className="text-xs font-bold text-slate-500 uppercase tracking-wider font-fredoka">
                គោលដៅផ្គុំពាក្យ៖ <span className="text-indigo-600 text-sm font-bold font-kantumruy">«{targetWord}»</span>
              </div>

              <div className="h-28 flex items-center justify-center px-8 bg-slate-50 border-2 border-indigo-200 rounded-3xl min-w-[200px]">
                <div className="text-7xl font-kantumruy font-black text-indigo-700 leading-relaxed overflow-visible py-2">
                  {assembledWord || '___'}
                </div>
              </div>

              <div className="flex gap-3">
                <button
                  onClick={handleSpeakWord}
                  disabled={!assembledWord}
                  className="px-4 py-2 rounded-xl bg-indigo-50 border border-indigo-200 hover:bg-indigo-100 text-indigo-700 font-kantumruy font-bold text-xs flex items-center gap-2"
                >
                  <IconVolume className="w-4 h-4" />
                  <span>ស្តាប់សំឡេង</span>
                </button>
                <button
                  onClick={() => { SoundBus.playPop(); setSelectedBase(''); setSelectedSub(''); setSelectedVowel(''); setFeedbackMsg(''); }}
                  className="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 font-kantumruy font-bold text-xs hover:bg-slate-100"
                >
                  សម្អាត
                </button>
              </div>
            </div>

            {/* Selection Banks */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {/* Base Consonants */}
              <div className="bg-white p-4 rounded-2xl border-2 border-slate-200/80">
                <div className="text-xs font-bold text-slate-600 font-kantumruy mb-2">១. ព្យញ្ជនៈដើម (Base)</div>
                <div className="grid grid-cols-4 gap-2">
                  {baseConsonants.map(c => (
                    <button
                      key={c}
                      onClick={() => { SoundBus.playPop(); setSelectedBase(c); }}
                      className={'h-12 rounded-xl border-2 font-kantumruy font-black text-xl flex items-center justify-center transition-all ' + (
                        selectedBase === c ? 'bg-indigo-600 text-white border-indigo-600 shadow-md scale-105' : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-indigo-50'
                      )}
                    >
                      {c}
                    </button>
                  ))}
                </div>
              </div>

              {/* Subscripts */}
              <div className="bg-white p-4 rounded-2xl border-2 border-slate-200/80">
                <div className="text-xs font-bold text-slate-600 font-kantumruy mb-2">២. ជើងអក្សរ (Subscript)</div>
                <div className="grid grid-cols-3 gap-2">
                  {subscripts.map(s => (
                    <button
                      key={s}
                      onClick={() => { SoundBus.playPop(); setSelectedSub(s); }}
                      className={'h-12 rounded-xl border-2 font-kantumruy font-black text-2xl flex items-center justify-center transition-all leading-relaxed overflow-visible ' + (
                        selectedSub === s ? 'bg-emerald-600 text-white border-emerald-600 shadow-md scale-105' : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-emerald-50'
                      )}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </div>

              {/* Vowels */}
              <div className="bg-white p-4 rounded-2xl border-2 border-slate-200/80">
                <div className="text-xs font-bold text-slate-600 font-kantumruy mb-2">៣. ស្រៈនិស្ស័យ (Vowel)</div>
                <div className="grid grid-cols-4 gap-2">
                  {vowels.map(v => (
                    <button
                      key={v}
                      onClick={() => { SoundBus.playPop(); setSelectedVowel(v); }}
                      className={'h-12 rounded-xl border-2 font-kantumruy font-black text-2xl flex items-center justify-center transition-all leading-relaxed overflow-visible ' + (
                        selectedVowel === v ? 'bg-amber-500 text-white border-amber-500 shadow-md scale-105' : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-amber-50'
                      )}
                    >
                      {v}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {feedbackMsg && (
              <div className={'p-3 rounded-2xl font-kantumruy text-sm font-bold text-center ' + (
                isSuccess ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-amber-50 text-amber-800 border border-amber-300'
              )}>
                {feedbackMsg}
              </div>
            )}

            <div className="flex justify-end">
              <button
                onClick={handleVerify}
                disabled={isSuccess || !selectedBase}
                className="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-98 text-white font-kantumruy font-black text-base shadow-md flex items-center justify-center gap-2"
              >
                <IconCheck className="w-5 h-5" />
                <span>ផ្ទៀងផ្ទាត់ការផ្គុំ (Verify Syllable)</span>
              </button>
            </div>
          </div>
        );
      };

      // --- Mode 2: SVO Syntax Rail ---
      const SvoRail = () => {
        const [slots, setSlots] = useState({
          subject: null,
          verb: null,
          object: null,
        });
        const [selectedWord, setSelectedWord] = useState(null);
        const [isTrainMoving, setIsTrainMoving] = useState(false);
        const [feedbackMsg, setFeedbackMsg] = useState('');

        const bank = [
          { id: 'w-1', text: 'កូនឆ្មា', type: 'subject' },
          { id: 'w-2', text: 'ចាប់', type: 'verb' },
          { id: 'w-3', text: 'សត្វកណ្តុរ', type: 'object' },
          { id: 'w-4', text: 'ញ៉ាំ', type: 'verb' },
          { id: 'w-5', text: 'សៀវភៅ', type: 'object' },
        ];

        const handleSelectWord = (word) => {
          SoundBus.playPop();
          setSelectedWord(word);
        };

        const handleAssignSlot = (slotKey) => {
          if (!selectedWord) return;
          SoundBus.playSnap();
          setSlots(prev => ({ ...prev, [slotKey]: selectedWord }));
          setSelectedWord(null);
          setFeedbackMsg('');
        };

        const handleClearSlot = (slotKey) => {
          SoundBus.playPop();
          setSlots(prev => ({ ...prev, [slotKey]: null }));
          setFeedbackMsg('');
        };

        const handleDepart = () => {
          if (slots.subject?.text === 'កូនឆ្មា' && slots.verb?.text === 'ចាប់' && slots.object?.text === 'សត្វកណ្តុរ') {
            SoundBus.playWhistle();
            SoundBus.playSuccess();
            SoundBus.playStar();
            setIsTrainMoving(true);
            setFeedbackMsg('🎉 រថភ្លើងចេញដំណើរ! ល្បះត្រូវតាមវេយ្យាករណ៍ខ្មែរ (SVO)!');
            SpeechEngine.speak('កូនឆ្មាចាប់សត្វកណ្តុរ', 'km-KH');
            setTimeout(() => onComplete(100), 1600);
          } else {
            SoundBus.playGentleError();
            setFeedbackMsg('⚠️ លំដាប់ល្បះមិនទាន់ត្រឹមត្រូវទេ! (ប្រធាន + កិរិយា + កម្មបទ)');
          }
        };

        return (
          <div className="space-y-6">
            {/* Railroad Track & Train */}
            <div className="bg-gradient-to-r from-slate-800 to-slate-900 p-8 rounded-3xl shadow-xl overflow-hidden relative min-h-[220px]">
              {/* Railroad Tracks */}
              <div className="absolute bottom-6 left-0 right-0 h-4 bg-amber-900 flex justify-between items-center px-4">
                {Array.from({ length: 30 }, (_, i) => (
                  <div key={i} className="w-1.5 h-7 bg-amber-700 shadow-sm" />
                ))}
              </div>

              {/* The Train Wagons */}
              <div className={'flex items-end gap-3 transition-transform duration-1000 ease-in-out ' + (isTrainMoving ? 'translate-x-[120%]' : '')}>
                {/* Engine Head */}
                <div className="w-24 h-24 bg-rose-600 rounded-3xl flex flex-col items-center justify-center text-white shadow-lg border-2 border-rose-400">
                  <span className="text-3xl">🚂</span>
                  <span className="text-[10px] font-fredoka font-bold uppercase">Engine</span>
                </div>

                {/* Wagon 1: Subject */}
                <div
                  onClick={() => handleAssignSlot('subject')}
                  className={'w-32 h-24 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center p-2 cursor-pointer transition-all ' + (
                    slots.subject ? 'bg-sky-600 border-sky-400 text-white' : 'bg-sky-950/60 border-sky-400/50 text-sky-200'
                  )}
                >
                  <span className="text-[10px] font-bold font-kantumruy uppercase">១. ប្រធាន (Subject)</span>
                  <span className="font-kantumruy font-black text-lg mt-1">{slots.subject ? slots.subject.text : 'ចុចដាក់'}</span>
                  {slots.subject && (
                    <button onClick={(e) => { e.stopPropagation(); handleClearSlot('subject'); }} className="text-[10px] text-rose-300 hover:text-white mt-1">✕ ដក</button>
                  )}
                </div>

                {/* Wagon 2: Verb */}
                <div
                  onClick={() => handleAssignSlot('verb')}
                  className={'w-32 h-24 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center p-2 cursor-pointer transition-all ' + (
                    slots.verb ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-emerald-950/60 border-emerald-400/50 text-emerald-200'
                  )}
                >
                  <span className="text-[10px] font-bold font-kantumruy uppercase">២. កិរិយា (Verb)</span>
                  <span className="font-kantumruy font-black text-lg mt-1">{slots.verb ? slots.verb.text : 'ចុចដាក់'}</span>
                  {slots.verb && (
                    <button onClick={(e) => { e.stopPropagation(); handleClearSlot('verb'); }} className="text-[10px] text-rose-300 hover:text-white mt-1">✕ ដក</button>
                  )}
                </div>

                {/* Wagon 3: Object */}
                <div
                  onClick={() => handleAssignSlot('object')}
                  className={'w-32 h-24 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center p-2 cursor-pointer transition-all ' + (
                    slots.object ? 'bg-amber-600 border-amber-400 text-white' : 'bg-amber-950/60 border-amber-400/50 text-amber-200'
                  )}
                >
                  <span className="text-[10px] font-bold font-kantumruy uppercase">៣. កម្មបទ (Object)</span>
                  <span className="font-kantumruy font-black text-lg mt-1">{slots.object ? slots.object.text : 'ចុចដាក់'}</span>
                  {slots.object && (
                    <button onClick={(e) => { e.stopPropagation(); handleClearSlot('object'); }} className="text-[10px] text-rose-300 hover:text-white mt-1">✕ ដក</button>
                  )}
                </div>
              </div>
            </div>

            {/* Word Bank Pool */}
            <div className="bg-white p-6 rounded-3xl border-2 border-slate-200/80 shadow-sm">
              <div className="text-xs font-bold text-slate-500 uppercase tracking-wider font-fredoka mb-3">
                ឃ្លាំងពាក្យ (Tap word, then tap train wagon to place)
              </div>
              <div className="flex flex-wrap gap-3">
                {bank.map(word => {
                  const isPlaced = Object.values(slots).some(s => s?.id === word.id);
                  const isSelected = selectedWord?.id === word.id;
                  return (
                    <button
                      key={word.id}
                      onClick={() => handleSelectWord(word)}
                      disabled={isPlaced || isTrainMoving}
                      className={'px-5 py-3 rounded-2xl border-2 font-kantumruy font-black text-base transition-all ' + (
                        isPlaced ? 'opacity-40 border-slate-200 bg-slate-100 cursor-not-allowed' :
                        isSelected ? 'bg-indigo-600 text-white border-indigo-600 ring-4 ring-indigo-300 scale-105 shadow-md' :
                        'bg-white text-slate-800 border-slate-300 hover:border-indigo-400 hover:bg-indigo-50/50'
                      )}
                    >
                      {word.text}
                    </button>
                  );
                })}
              </div>
            </div>

            {feedbackMsg && (
              <div className={'p-3 rounded-2xl font-kantumruy text-sm font-bold text-center ' + (
                isTrainMoving ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-amber-50 text-amber-800 border border-amber-300'
              )}>
                {feedbackMsg}
              </div>
            )}

            <div className="flex justify-end">
              <button
                onClick={handleDepart}
                disabled={isTrainMoving || !slots.subject || !slots.verb || !slots.object}
                className="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-98 text-white font-kantumruy font-black text-base shadow-md flex items-center justify-center gap-2"
              >
                <IconTrain className="w-5 h-5" />
                <span>ចេញដំណើររថភ្លើង (Depart Train)</span>
              </button>
            </div>
          </div>
        );
      };

      // --- Mode 3: Silent Consonant Inspector ---
      const SilentMarker = () => {
        const [crowned, setCrowned] = useState(false);
        const [feedbackMsg, setFeedbackMsg] = useState('');

        const letters = [
          { id: 'l-1', char: 'ស', isSilent: false },
          { id: 'l-2', char: 'ប្ត', isSilent: false },
          { id: 'l-3', char: 'ា', isSilent: false },
          { id: 'l-4', char: 'ហ', isSilent: true },
        ];

        const handleTapLetter = (l) => {
          if (crowned) return;
          if (l.isSilent) {
            SoundBus.playSuccess();
            SoundBus.playStar();
            setCrowned(true);
            setFeedbackMsg('🎉 ត្រឹមត្រូវ! អក្សរ «ហ» ជាព្យញ្ជនៈស្ងាត់ ត្រូវបំបាត់សំឡេងដោយសញ្ញាទណ្ឌឃាត (៍) -> «សប្តាហ៍»!');
            SpeechEngine.speak('សប្តាហ៍', 'km-KH');
            setTimeout(() => onComplete(100), 1600);
          } else {
            SoundBus.playGentleError();
            setFeedbackMsg('⚠️ អក្សរ «' + l.char + '» មានបញ្ចេញសំឡេង! មិនមែនជាតួស្ងាត់ទេ');
          }
        };

        return (
          <div className="space-y-6">
            <div className="bg-white p-8 rounded-3xl border-2 border-slate-200/80 shadow-sm text-center">
              <div className="text-xs font-bold text-slate-500 uppercase tracking-wider font-fredoka mb-2">
                ពាក្យកម្ចីបាលី-សំស្ក្រឹត (Loanword Silent Marker)
              </div>
              <div className="text-sm font-kantumruy text-slate-600 mb-6">
                ចុចលើតួអក្សរដែលត្រូវពាក់សញ្ញាទណ្ឌឃាត (៍) ដើម្បីបំបាត់សំឡេង៖
              </div>

              <div className="flex justify-center items-center gap-4 py-6">
                {letters.map(l => (
                  <button
                    key={l.id}
                    onClick={() => handleTapLetter(l)}
                    className="w-20 h-24 rounded-2xl bg-indigo-50 border-2 border-indigo-200 hover:bg-indigo-100 active:scale-95 text-4xl font-black font-kantumruy text-indigo-900 flex flex-col items-center justify-center relative shadow-sm transition-transform leading-relaxed overflow-visible"
                  >
                    {l.isSilent && crowned && (
                      <span className="absolute -top-3 text-amber-500 font-bold text-3xl animate-bounce">៍</span>
                    )}
                    <span>{l.char}</span>
                  </button>
                ))}
              </div>

              {crowned && (
                <div className="mt-4 inline-flex items-center gap-2 bg-emerald-100 border border-emerald-300 text-emerald-900 px-6 py-2 rounded-full font-kantumruy font-black text-xl shadow-sm">
                  <span>✨</span>
                  <span>សប្តាហ៍ (Week)</span>
                </div>
              )}
            </div>

            {feedbackMsg && (
              <div className={'p-3 rounded-2xl font-kantumruy text-sm font-bold text-center ' + (
                crowned ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-amber-50 text-amber-800 border border-amber-300'
              )}>
                {feedbackMsg}
              </div>
            )}
          </div>
        );
      };

      return (
        <div>
          {mode === 'syllable_constructor' && <SyllableConstructor />}
          {mode === 'svo_rail' && <SvoRail />}
          {mode === 'silent_marker' && <SilentMarker />}
        </div>
      );
    });

    // =========================================================================
    // ENGINE E: CHRONOLOGICAL STAGE SEQUENCER (Tap-to-Select -> Tap-to-Place)
    // =========================================================================
    const SequencerEngine = memo(({ game, onComplete }) => {
      const stages = game.data?.stages || [];
      const [pool, setPool] = useState([]);
      const [slots, setSlots] = useState(() => Array(stages.length).fill(null));
      const [selectedStage, setSelectedStage] = useState(null);
      const [isSuccess, setIsSuccess] = useState(false);
      const [feedbackMsg, setFeedbackMsg] = useState('');

      useEffect(() => {
        const shuffled = [...stages].sort(() => Math.random() - 0.5);
        setPool(shuffled);
        setSlots(Array(stages.length).fill(null));
        setSelectedStage(null);
        setIsSuccess(false);
        setFeedbackMsg('');
      }, [game]);

      const handleSelectCard = (stage) => {
        if (isSuccess) return;
        SoundBus.playPop();
        setSelectedStage(stage);
      };

      const handlePlaceInSlot = (slotIdx) => {
        if (!selectedStage || isSuccess) return;
        SoundBus.playSnap();

        const currentInSlot = slots[slotIdx];
        const nextSlots = [...slots];
        nextSlots[slotIdx] = selectedStage;
        setSlots(nextSlots);

        setPool(prev => {
          const filtered = prev.filter(s => s.id !== selectedStage.id);
          if (currentInSlot && currentInSlot.id !== selectedStage.id) {
            return [...filtered, currentInSlot];
          }
          return filtered;
        });

        setSelectedStage(null);
        setFeedbackMsg('');
      };

      const handleRemoveFromSlot = (slotIdx) => {
        if (isSuccess) return;
        const stage = slots[slotIdx];
        if (!stage) return;

        SoundBus.playPop();
        const nextSlots = [...slots];
        nextSlots[slotIdx] = null;
        setSlots(nextSlots);
        setPool(prev => [...prev, stage]);
        setFeedbackMsg('');
      };

      const handleVerifySequence = () => {
        const isComplete = slots.every(s => s !== null);
        if (!isComplete) {
          SoundBus.playGentleError();
          setFeedbackMsg('⚠️ សូមដាក់កាតចូលគ្រប់ប្រអប់ដំណាក់កាលជាមុនសិន!');
          return;
        }

        const isCorrect = slots.every((s, idx) => s.stepNumber === idx + 1);

        if (isCorrect) {
          SoundBus.playSuccess();
          SoundBus.playStar();
          setIsSuccess(true);
          setFeedbackMsg('🎉 អស្ចារ្យណាស់! អ្នកបានតម្រៀបលំដាប់លំដោយបានត្រឹមត្រូវ ១០០%!');
          setTimeout(() => onComplete(100), 1500);
        } else {
          SoundBus.playGentleError();
          setFeedbackMsg('⚠️ លំដាប់លំដោយមិនទាន់ត្រឹមត្រូវទេ! សូមពិនិត្យមើលដំណាក់កាលឡើងវិញ');
        }
      };

      return (
        <div className="space-y-6">
          {/* Target Slots Runway */}
          <div className="bg-white p-6 rounded-3xl border-2 border-slate-200/80 shadow-sm">
            <div className="text-xs font-bold text-slate-500 uppercase tracking-wider font-fredoka mb-4">
              លំដាប់លូតលាស់ / លំដាប់កាលវេលា (Chronological Sequence)
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
              {slots.map((st, idx) => (
                <div
                  key={idx}
                  onClick={() => handlePlaceInSlot(idx)}
                  className={'min-h-[160px] rounded-2xl border-2 border-dashed p-4 flex flex-col items-center justify-between transition-all cursor-pointer ' + (
                    st
                      ? 'bg-indigo-50/70 border-indigo-400 shadow-sm'
                      : selectedStage
                      ? 'bg-amber-50/50 border-amber-400 hover:bg-amber-100/60 ring-2 ring-amber-300'
                      : 'bg-slate-50 border-slate-300 hover:border-indigo-300'
                  )}
                >
                  <div className="w-full flex justify-between items-center text-xs font-bold font-kantumruy text-slate-500">
                    <span className="bg-slate-200 px-2 py-0.5 rounded-full">ដំណាក់កាលទី {toKhmerNumeral(idx + 1)}</span>
                    {st && !isSuccess && (
                      <button
                        onClick={(e) => { e.stopPropagation(); handleRemoveFromSlot(idx); }}
                        className="text-rose-500 hover:text-rose-700 font-bold"
                      >
                        ✕ ដក
                      </button>
                    )}
                  </div>

                  {st ? (
                    <div className="flex flex-col items-center text-center">
                      <span className="text-4xl my-1">{st.icon}</span>
                      <span className="font-kantumruy font-black text-slate-800 text-sm">{st.titleKhmer}</span>
                      <span className="font-kantumruy text-[11px] text-slate-500 mt-1">{st.descriptionKhmer}</span>
                    </div>
                  ) : (
                    <div className="text-slate-400 font-kantumruy text-xs text-center py-6">
                      {selectedStage ? 'ចុចទីនេះដើម្បីដាក់' : 'ប្រអប់ទទេ'}
                    </div>
                  )}

                  <div className="w-full text-center text-[10px] font-fredoka uppercase text-slate-400 font-bold">
                    Step {idx + 1}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Shuffled Cards Pool */}
          <div className="bg-slate-100/80 p-6 rounded-3xl border-2 border-slate-200/80">
            <div className="text-xs font-bold text-slate-500 uppercase tracking-wider font-fredoka mb-3">
              កាតដំណាក់កាល (Tap card to select, then tap slot above)
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              {pool.length === 0 ? (
                <div className="col-span-full text-center py-4 font-kantumruy text-slate-500 text-sm">
                  កាតទាំងអស់ត្រូវបានដាក់ចូលក្នុងប្រអប់រួចរាល់ហើយ! សូមចុចផ្ទៀងផ្ទាត់ខាងក្រោម
                </div>
              ) : (
                pool.map(st => {
                  const isSelected = selectedStage?.id === st.id;
                  return (
                    <button
                      key={st.id}
                      onClick={() => handleSelectCard(st)}
                      className={'p-4 rounded-2xl border-2 bg-white flex flex-col items-center text-center gap-1.5 transition-all shadow-sm ' + (
                        isSelected
                          ? 'ring-4 ring-indigo-500 scale-105 shadow-xl border-indigo-500 bg-indigo-50/30'
                          : 'border-slate-200 hover:border-indigo-300 hover:scale-102 active:scale-95'
                      )}
                    >
                      <span className="text-3xl">{st.icon}</span>
                      <span className="font-kantumruy font-black text-slate-800 text-sm">{st.titleKhmer}</span>
                      <span className="font-kantumruy text-[10px] text-slate-500">{st.descriptionKhmer}</span>
                    </button>
                  );
                })
              )}
            </div>
          </div>

          {feedbackMsg && (
            <div className={'p-3 rounded-2xl font-kantumruy text-sm font-bold text-center ' + (
              isSuccess ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-amber-50 text-amber-800 border border-amber-300'
            )}>
              {feedbackMsg}
            </div>
          )}

          <div className="flex justify-end">
            <button
              onClick={handleVerifySequence}
              disabled={isSuccess || slots.some(s => s === null)}
              className={'w-full sm:w-auto px-8 py-3.5 rounded-2xl font-kantumruy font-black text-base text-white shadow-md flex items-center justify-center gap-2 transition-all ' + (
                isSuccess || slots.some(s => s === null)
                  ? 'bg-slate-300 cursor-not-allowed'
                  : 'bg-indigo-600 hover:bg-indigo-700 active:scale-98'
              )}
            >
              <IconCheck className="w-5 h-5" />
              <span>ផ្ទៀងផ្ទាត់លំដាប់ (Verify Sequence)</span>
            </button>
          </div>
        </div>
      );
    });

    // =========================================================================
    // FLOATING SUBTITLE BANNER (Decoupled Audio Broadcaster)
    // =========================================================================
    const SubtitleBanner = memo(() => {
      const [subtitle, setSubtitle] = useState('');
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        let timer = null;
        const unsubscribe = SoundBus.onSubtitle((text) => {
          setSubtitle(text);
          setVisible(true);
          if (timer) clearTimeout(timer);
          timer = setTimeout(() => {
            setVisible(false);
          }, 4500);
        });

        return () => {
          if (unsubscribe) unsubscribe();
          if (timer) clearTimeout(timer);
        };
      }, []);

      if (!visible || !subtitle) return null;

      return (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 max-w-xl w-11/12 animate-bounce-short pointer-events-none">
          <div className="bg-slate-900/95 text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-3 backdrop-blur-md">
            <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shrink-0 shadow-inner">
              <IconVolume className="w-5 h-5 animate-pulse" />
            </div>
            <div className="flex-1 font-kantumruy font-bold text-sm sm:text-base leading-relaxed overflow-visible py-1 text-slate-100">
              {subtitle}
            </div>
          </div>
        </div>
      );
    });

    // =========================================================================
    // VICTORY MODAL (Celebration & High Replayability)
    // =========================================================================
    const VictoryModal = memo(({ onPlayAgain, onBackToHub, score = 100 }) => {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl p-8 max-w-md w-full border-4 border-amber-300 shadow-2xl text-center flex flex-col items-center gap-5 transform transition-all animate-bounce-short">
            <div className="w-24 h-24 rounded-full bg-gradient-to-tr from-amber-400 to-yellow-300 flex items-center justify-center text-5xl shadow-lg border-4 border-white -mt-16">
              🏆
            </div>

            <div className="flex gap-2 text-amber-400 text-3xl justify-center">
              <span>⭐</span>
              <span className="scale-125 -translate-y-1">⭐</span>
              <span>⭐</span>
            </div>

            <div>
              <h2 className="text-2xl font-black font-kantumruy text-slate-800">
                អបអរសាទរ! ពូកែណាស់!
              </h2>
              <p className="text-slate-500 font-kantumruy text-sm mt-1">
                អ្នកបានបញ្ចប់ការលេងដោយជោគជ័យ និងទទួលបាន {toKhmerNumeral(score)} ពិន្ទុ!
              </p>
            </div>

            <div className="w-full bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 flex justify-around font-kantumruy">
              <div>
                <div className="text-xs text-slate-500">ផ្កាយទទួលបាន</div>
                <div className="text-xl font-black text-amber-600 font-fredoka">+3 ⭐</div>
              </div>
              <div className="w-px bg-amber-200" />
              <div>
                <div className="text-xs text-slate-500">ពិន្ទុបន្ថែម</div>
                <div className="text-xl font-black text-emerald-600 font-fredoka">+{score} pts</div>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row gap-3 w-full mt-2">
              <button
                onClick={onPlayAgain}
                className="flex-1 py-3.5 px-4 rounded-2xl border-2 border-slate-200 hover:bg-slate-100 font-kantumruy font-bold text-slate-700 flex items-center justify-center gap-2 transition-transform active:scale-95"
              >
                <IconRotateCcw className="w-5 h-5 text-slate-600" />
                <span>លេងម្តងទៀត</span>
              </button>

              <button
                onClick={onBackToHub}
                className="flex-1 py-3.5 px-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 font-kantumruy font-black text-white shadow-md flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-indigo-200"
              >
                <IconArrowLeft className="w-5 h-5" />
                <span>ត្រឡប់ទៅមឺនុយ</span>
              </button>
            </div>
          </div>
        </div>
      );
    });

    // =========================================================================
    // UNIVERSAL GAME RUNNER (Header HUD + Engine Orchestrator)
    // =========================================================================
    const UniversalGameRunner = memo(({ game, onBack, onCompleteLevel, currentStars }) => {
      const [resetKey, setResetKey] = useState(0);
      const [showVictory, setShowVictory] = useState(false);
      const [levelScore, setLevelScore] = useState(100);

      const handleRestart = () => {
        SoundBus.playPop();
        setResetKey(prev => prev + 1);
        setShowVictory(false);
      };

      const handleGameWin = (score = 100) => {
        setLevelScore(score);
        setShowVictory(true);
        if (onCompleteLevel) onCompleteLevel(score);
      };

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col pb-16">
          {/* Top HUD */}
          <header className="bg-white border-b-2 border-slate-200/80 sticky top-0 z-40 px-4 py-3 sm:px-8 shadow-sm">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <button
                  onClick={onBack}
                  className="p-2.5 rounded-2xl border-2 border-slate-200 hover:bg-slate-100 active:scale-95 text-slate-700 transition-all"
                  title="ត្រឡប់ទៅមឺនុយ"
                >
                  <IconArrowLeft className="w-5 h-5" />
                </button>

                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xl">{game.icon || '🎮'}</span>
                    <h1 className="font-kantumruy font-black text-slate-800 text-base sm:text-lg leading-tight line-clamp-1">
                      {game.titleKhmer}
                    </h1>
                  </div>
                  <div className="text-slate-400 text-xs font-fredoka font-semibold line-clamp-1">
                    {game.titleEnglish}
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                <div className="flex items-center gap-1.5 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-2xl">
                  <span className="text-amber-500 font-bold text-base">⭐</span>
                  <span className="font-fredoka font-bold text-amber-900 text-sm">{currentStars}</span>
                </div>

                <button
                  onClick={handleRestart}
                  className="p-2.5 rounded-2xl border-2 border-slate-200 hover:bg-slate-100 active:scale-95 text-slate-700 transition-all"
                  title="លេងឡើងវិញ"
                >
                  <IconRotateCcw className="w-5 h-5" />
                </button>
              </div>
            </div>
          </header>

          {/* Instructional Prompt Banner */}
          <div className="max-w-4xl mx-auto w-full px-4 pt-6">
            <div className="bg-indigo-50/80 border-2 border-indigo-200/90 rounded-3xl p-4 sm:p-5 flex items-center justify-between gap-4 shadow-sm">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-indigo-600 text-white flex items-center justify-center shrink-0 shadow-sm">
                  <IconSparkles className="w-5 h-5" />
                </div>
                <p className="font-kantumruy font-bold text-indigo-950 text-sm sm:text-base leading-relaxed overflow-visible py-1">
                  {game.promptText}
                </p>
              </div>
              <SpeakerButton text={game.promptText} className="shrink-0" />
            </div>
          </div>

          {/* Engine Playground Stage */}
          <main className="max-w-4xl mx-auto w-full px-4 pt-6 flex-1">
            {game.engineType === 'sorter' && (
              <SorterEngine key={resetKey} game={game} onComplete={handleGameWin} />
            )}
            {game.engineType === 'sandbox' && (
              <SandboxEngine key={resetKey} game={game} onComplete={handleGameWin} />
            )}
            {game.engineType === 'math_cra' && (
              <MathCraEngine key={resetKey} game={game} onComplete={handleGameWin} />
            )}
            {game.engineType === 'khmer_phonetics' && (
              <KhmerPhoneticsEngine key={resetKey} game={game} onComplete={handleGameWin} />
            )}
            {game.engineType === 'sequencer' && (
              <SequencerEngine key={resetKey} game={game} onComplete={handleGameWin} />
            )}
          </main>

          {/* Victory Modal */}
          {showVictory && (
            <VictoryModal
              score={levelScore}
              onPlayAgain={handleRestart}
              onBackToHub={onBack}
            />
          )}
        </div>
      );
    });

    // =========================================================================
